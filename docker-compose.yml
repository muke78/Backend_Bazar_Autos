services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: bazar_mysql
    restart: always
    # Sin ports: BD no es accesible desde fuera — solo red interna Docker
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}           # ⚠️  NO puede ser "root" — usa otro nombre (ej: bazar_user)
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - bazar_net
    healthcheck:
      # Usa root + MYSQL_ROOT_PASSWORD para el ping (independiente de DB_USER)
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_PASS} --silent"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Backend Node.js ────────────────────────────────────────────────────────
  api:
    build: .
    container_name: bazar_backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"   # Solo accesible desde localhost (Nginx proxy)
    env_file:
      - .env
    environment:
      DB_HOST: db
      NODE_ENV: production
    volumes:
      - logs_data:/logs
    networks:
      - bazar_net
    depends_on:
      db:
        condition: service_healthy   # Espera a que MySQL esté realmente listo
    # /dev/shm extra para Chromium (Puppeteer PDF) en Docker
    shm_size: "256mb"

networks:
  bazar_net:
    driver: bridge

volumes:
  mysql_data:
  logs_data:
