openapi: 3.0.0
info:
  title: API_Bazar_Autos
  version: 1.0.0
  description: >-
    ## 📋 Descripción GeneralEndFragment


    Este sistema permite administrar el ciclo completo de compra, reparación,
    inversión y venta de vehículos. Cubre los siguientes módulos


    | **Modulo** | **Descripcion** |

    | --- | --- |

    | 🚗 Autos | Control de inventario y estado de cada vehículo |

    | 💸 Movimientos | Registro de gastos y entradas de dinero generales |

    | 🔧 Costos por vehículo | Gastos directamente asociados a un auto
    específico |

    | 👥 Inversionistas | Seguimiento del capital aportado por cada socio |

    | 🔐 Usuarios | Administración de accesos al sistema |
